# OpenBucket — Coolify service template.
#
# In Coolify: New Resource → Docker Compose → paste this file (or point it at the
# raw URL). Coolify auto-generates JWT_SECRET and ROOT_SECRET_ACCESS_KEY (the
# SERVICE_PASSWORD_64_* magic variables). Then, in the service's Environment
# Variables, set OPENBUCKET_ADMIN_PASSWORD_HASH — the one value Coolify can't
# generate. Produce it with:
#
#     npx @openbucket/nestjs hash 'your-admin-password'
#
# and paste the printed $argon2id$... string. Assign a domain in Coolify; it
# routes to the service's port 9000.
services:
  openbucket:
    image: ghcr.io/projectbay/openbucket:0.1.0-alpha.18
    environment:
      - DATA_DIR=/data
      - PORT=9000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # REQUIRED — set this in Coolify's Environment Variables (argon2id hash).
      - ADMIN_PASSWORD_HASH=${OPENBUCKET_ADMIN_PASSWORD_HASH}
      # Auto-generated by Coolify (64-char secrets, both >= 32 chars):
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - ROOT_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_64_ROOTSECRET}
      # Not secret (like an AWS access key ID) — override if you like:
      - ROOT_ACCESS_KEY_ID=${OPENBUCKET_ROOT_ACCESS_KEY_ID:-AKIAOPENBUCKETROOT01}
      - OPENBUCKET_REGION=${OPENBUCKET_REGION:-us-east-1}
    volumes:
      - openbucket-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/api/admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  openbucket-data:
