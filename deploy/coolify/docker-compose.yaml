# OpenBucket — Coolify service template.
#
# In Coolify: New Resource → Docker Compose → paste this file (or point it at the
# raw URL). Coolify auto-generates the admin password, JWT secret, and S3 root
# secret (the SERVICE_PASSWORD_* magic variables). Assign a domain in Coolify; it
# routes to the service's port 9000.
#
# The generated admin password is in the service's Environment Variables after
# deploy (SERVICE_PASSWORD_ADMIN) — copy it to log in. Prefer to pick your own?
# Set OPENBUCKET_ADMIN_PASSWORD there and it overrides the generated one.
services:
  openbucket:
    image: ghcr.io/projectbay/openbucket:0.1.0-alpha.20
    environment:
      - DATA_DIR=/data
      - PORT=9000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # OpenBucket argon2id-hashes this on first boot — never stored in plaintext.
      # Coolify auto-generates it; to choose your own, edit ADMIN_PASSWORD in the
      # service's Environment Variables after the first deploy.
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      # Auto-generated by Coolify (64-char secrets, both >= 32 chars):
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - ROOT_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_64_ROOTSECRET}
      # Not secret (like an AWS access key ID) — override if you like:
      - ROOT_ACCESS_KEY_ID=${OPENBUCKET_ROOT_ACCESS_KEY_ID:-AKIAOPENBUCKETROOT01}
      - OPENBUCKET_REGION=${OPENBUCKET_REGION:-us-east-1}
    volumes:
      - openbucket-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/api/admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  openbucket-data:
