captainVersion: 4

# OpenBucket — CapRover one-click app.
#
# Deploy: CapRover dashboard → Apps → One-Click Apps/Databases → paste this file's
# raw URL, or paste the YAML directly. The JWT secret and S3 root secret are
# generated for you; you MUST supply an argon2id admin-password hash (see the
# instructions below).
services:
  $$cap_appname:
    image: ghcr.io/projectbay/openbucket:$$cap_openbucket_version
    restart: always
    volumes:
      - $$cap_appname-data:/data
    environment:
      DATA_DIR: /data
      PORT: '9000'
      ADMIN_USERNAME: $$cap_admin_username
      ADMIN_PASSWORD_HASH: $$cap_admin_password_hash
      JWT_SECRET: $$cap_jwt_secret
      ROOT_ACCESS_KEY_ID: $$cap_root_access_key_id
      ROOT_SECRET_ACCESS_KEY: $$cap_root_secret_access_key
      OPENBUCKET_REGION: $$cap_region
    caproverExtra:
      containerHttpPort: '9000'

caproverOneClickApp:
  displayName: OpenBucket
  isOfficial: false
  description: A self-hosted, S3-compatible object store with a built-in admin console. Point any S3 SDK at it, or embed it in a NestJS app.
  documentation: Deploys the standalone ghcr.io/projectbay/openbucket image. Docs — https://projectbay.github.io/openbucket/

  variables:
    - id: $$cap_openbucket_version
      label: OpenBucket image tag
      defaultValue: '0.1.0-alpha.18'
      description: 'Image tag to deploy. See published tags: https://github.com/ProjectBay/openbucket/pkgs/container/openbucket'
      validRegex: /^([^\s^\/])+$/

    - id: $$cap_admin_username
      label: Admin username
      defaultValue: admin
      description: Username for the admin console login.
      validRegex: /^[a-zA-Z0-9._-]{1,64}$/

    - id: $$cap_admin_password_hash
      label: Admin password hash (argon2id) — REQUIRED
      defaultValue: ''
      description: "Generate with:  npx @openbucket/nestjs hash 'your-password'  — then paste the printed $argon2id$... string here."
      validRegex: /^\$argon2id\$.+/

    - id: $$cap_jwt_secret
      label: JWT secret (auto-generated)
      defaultValue: $$cap_gen_random_hex(48)
      description: Signs admin JWTs (must be >= 32 chars). A random value is generated for you.
      validRegex: /^.{32,}$/

    - id: $$cap_root_access_key_id
      label: S3 root access key ID
      defaultValue: AKIAOPENBUCKETROOT01
      description: 16-32 UPPERCASE alphanumerics. Not a secret (like an AWS access key ID) — change it if you like.
      validRegex: /^[A-Z0-9]{16,32}$/

    - id: $$cap_root_secret_access_key
      label: S3 root secret access key (auto-generated)
      defaultValue: $$cap_gen_random_hex(48)
      description: The S3 root secret (>= 32 chars). Auto-generated — copy it from the app's App Configs after deploy to configure your S3 client.
      validRegex: /^.{32,}$/

    - id: $$cap_region
      label: S3 region
      defaultValue: us-east-1
      description: Region reported to S3 clients.
      validRegex: /^[a-z0-9-]{1,32}$/

  instructions:
    start: |
      OpenBucket — a self-hosted, S3-compatible object store with an admin console.

      BEFORE deploying, generate an admin-password hash (the one value that is not
      auto-generated). On any machine with Node:

        npx @openbucket/nestjs hash 'your-admin-password'

      Paste the printed $argon2id$... string into the "Admin password hash" field.
      The JWT secret and S3 root secret are generated for you.
    end: |
      OpenBucket is deployed. The S3 API and admin console share the app's HTTP port (9000):
        • Admin console:  https://$$cap_appname.$$cap_root_domain/admin
        • S3 endpoint:    https://$$cap_appname.$$cap_root_domain   (path-style — set forcePathStyle: true)

      Copy ROOT_SECRET_ACCESS_KEY from the app's "App Configs" tab to configure your S3 client.
      Docs: https://projectbay.github.io/openbucket/
