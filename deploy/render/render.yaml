# OpenBucket — Render blueprint. https://render.com/docs/blueprint-spec
#
# Render generates the admin password, JWT secret, and S3 root secret for you.
# Copy the generated ADMIN_PASSWORD from the dashboard to log in (or replace its
# value with one of your own).
services:
  - type: web
    name: openbucket
    runtime: image
    image:
      url: ghcr.io/projectbay/openbucket:0.1.0-alpha.20
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "9000"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true # random admin password — copy it from the dashboard to log in
      - key: JWT_SECRET
        generateValue: true # random value (verify it is >= 32 chars)
      - key: ROOT_ACCESS_KEY_ID
        value: AKIAOPENBUCKETROOT01
      - key: ROOT_SECRET_ACCESS_KEY
        generateValue: true
      - key: OPENBUCKET_REGION
        value: us-east-1
    disk:
      name: openbucket-data
      mountPath: /data
      sizeGB: 10
