# .github/workflows/release-nestjs.yml
# Publish @openbucket/nestjs to npm (packaging plan, phase 6).
#
# Trigger: push a tag `nestjs-v<version>` (e.g. nestjs-v0.1.0), or run manually
# via workflow_dispatch. The job gates on deterministic checks (lint + a clean
# lib/SPA build = tsc typecheck), assembles the publishable dist (lib build +
# bundled admin SPA), then `npm publish` from dist/libs/nestjs.
#
# The publish gate deliberately does NOT re-run the unit suite: the lib's
# concurrency / blob-store specs are known-flaky (race, not parallelism — they
# fail intermittently even with --runInBand). Functional unit/e2e validation is
# ci.yml's job; cut the release tag from a commit whose ci.yml is green.
#
# Requires repo secret NPM_TOKEN — an npm automation token with publish rights
# to the @openbucket scope.
#
# NOTE: authored but NOT executed in the dev environment (no GitHub Actions
# runner). Mirrors ci.yml's runner + setup conventions.
name: release-nestjs

on:
  push:
    tags: ['nestjs-v*']
  workflow_dispatch:

concurrency:
  group: release-nestjs-${{ github.ref }}
  cancel-in-progress: false

env:
  # Node 22 on Linux satisfies Angular's require(ESM) — see ci.yml. (libsql's
  # N-API binding is ABI-stable across Node majors, so it imposes no Node pin.
  # The Node 20 backend / Node 23 frontend split is a Windows-dev quirk only and
  # does not apply on the Linux runner.)
  NODE_VERSION: '22'

jobs:
  publish:
    name: build + publish to npm
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the GitHub Release for this tag
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --no-audit --no-fund

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#nestjs-v}"
          pkg_version="$(node -p "require('./libs/nestjs/package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($tag_version) != libs/nestjs/package.json version $pkg_version"
            exit 1
          fi
          echo "Publishing @openbucket/nestjs@$pkg_version"

      - name: Lint
        run: npx nx lint nestjs

      - name: Build admin SPA (frontend)
        run: npx nx build openbucket-frontend

      - name: Build lib + bundle SPA
        # bundle-spa dependsOn the lib's tsc build, then copies the SPA from the
        # frontend build above into dist/libs/nestjs/assets/spa.
        run: npx nx bundle-spa nestjs

      - name: Publish to npm
        # Pre-release versions (those with a `-`, e.g. 0.1.0-alpha.1) publish to
        # the `next` dist-tag so `npm install @openbucket/nestjs` keeps resolving
        # to the latest STABLE release; stable versions go to `latest`.
        run: |
          version="$(node -p "require('./dist/libs/nestjs/package.json').version")"
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "Publishing @openbucket/nestjs@$version to dist-tag '$dist_tag'"
          npm publish ./dist/libs/nestjs --access public --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish a GitHub Release (notes from the matching CHANGELOG section) so the
      # admin console's About/updates card can list changelogs and detect updates.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#nestjs-v}"
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md)"
          [ -z "$notes" ] && notes="Release v$version"
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "v$version" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "v$version" --notes "$notes" $prerelease --verify-tag
          fi
